//core game code modules
include ':SPD-classes'
include ':core'

//platform modules
include ':android'
include ':ios'
include ':desktop'

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'

include ':web'

// The gitlink fixes the compiler source revision; no Maven publication is required.
includeBuild('vendor/teavm') {
    dependencySubstitution {
        substitute module('org.teavm:teavm-gradle-plugin') using project(':tools:gradle')
        substitute module('org.teavm:teavm-core') using project(':core')
        substitute module('org.teavm:teavm-classlib') using project(':classlib')
        substitute module('org.teavm:teavm-tooling') using project(':tools:core')
        substitute module('org.teavm:teavm-platform') using project(':platform')
        substitute module('org.teavm:teavm-interop') using project(':interop:core')
        substitute module('org.teavm:teavm-jso') using project(':jso:core')
        substitute module('org.teavm:teavm-jso-apis') using project(':jso:apis')
        substitute module('org.teavm:teavm-jso-impl') using project(':jso:impl')
        substitute module('org.teavm:teavm-metaprogramming-api') using project(':metaprogramming:api')
        substitute module('org.teavm:teavm-metaprogramming-impl') using project(':metaprogramming:impl')
        substitute module('org.teavm:teavm-extension-apis') using project(':extension:apis')
        substitute module('org.teavm:teavm-extension-spi') using project(':extension:spi')
        substitute module('org.teavm:teavm-extension-spi-util') using project(':extension:spi-util')
        substitute module('org.teavm:teavm-extension-annotation-processor') using project(':extension:processor')
        substitute module('org.teavm:teavm-devserver-client') using project(':tools:devserver:client')
        substitute module('org.teavm:teavm-devserver') using project(':tools:devserver:core')
        substitute module('org.teavm:teavm-devserver-runner') using project(':tools:devserver:runner')
        substitute module('org.teavm:cli') using project(':tools:cli')
        substitute module('org.teavm:teavm-c-incremental') using project(':tools:c-incremental')
        substitute module('org.teavm:teavm-junit') using project(':tools:junit')
        substitute module('org.teavm:teavm-browser-runner') using project(':tools:browser-runner')
        substitute module('org.teavm:teavm-chrome-rdp') using project(':tools:chrome-rdp')
    }
}

includeBuild('vendor/gdx-teavm') {
    dependencySubstitution {
        substitute module('com.github.xpenatan.gdx-teavm:backend-shared') using project(':backends:backend-shared')
        substitute module('com.github.xpenatan.gdx-teavm:backend-web') using project(':backends:backend-web')
        substitute module('com.github.xpenatan.gdx-teavm:asset-loader') using project(':extensions:asset-loader')
        substitute module('com.github.xpenatan.gdx-teavm:gdx-freetype-web') using project(':extensions:web:gdx-freetype-web')
        substitute module('com.github.xpenatan.gdx-teavm:gdx-controllers-web') using project(':extensions:web:gdx-controllers-web')
    }
}
